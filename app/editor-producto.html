<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor de página · TiendaIQ</title>
  <meta name="shopify-api-key" content="{{SHOPIFY_CLIENT_ID}}">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
  <link rel="stylesheet" href="/dist/editor.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #f6f6f7; }
    #estado { position: fixed; inset: 0; display: grid; place-items: center; color: #6d7175; font: 450 14px/1.4 "Segoe UI Variable",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-variation-settings: "wght" 450; }
    #estado[hidden] { display: none; }
    #error { max-width: 460px; padding: 20px; border: 1px solid #e3e3e3; border-radius: 10px; background: #fff; color: #d72c0d; }
    #notificacion { position: fixed; z-index: 60; right: 18px; bottom: 18px; max-width: 360px; padding: 11px 14px; border: 1px solid #d8dce2; border-radius: 8px; background: #fff; color: #202223; box-shadow: 0 4px 14px rgba(0,0,0,.14); font: 450 13px/1.4 "Segoe UI Variable",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-variation-settings: "wght" 450; }
    #notificacion[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="estado">Abriendo el documento…</div>
  <div id="error" hidden></div>
  <div id="notificacion" role="status" aria-live="polite" hidden></div>
  <main id="raiz"></main>
  <script src="/dist/editor.js"></script>
  <script>
    (function () {
      "use strict";

      const estado = document.getElementById("estado");
      const error = document.getElementById("error");
      const notificacion = document.getElementById("notificacion");
      const raiz = document.getElementById("raiz");
      const id = new URLSearchParams(location.search).get("id");
      const escapar = (valor) => String(valor || "").replace(/[&<>\"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      async function pase() {
        return window.shopify && window.shopify.idToken ? await window.shopify.idToken() : null;
      }

      function esPaseVencido(error) {
        return /pase de sesión (vencido|expirado)|session token (expired|invalid)/i.test(
          String(error && error.message || "")
        );
      }

      async function api(ruta, opciones) {
        let reintentosPase = 0;
        while (true) {
          try {
            const token = await pase();
            const headers = { "Content-Type": "application/json" };
            if (token) headers.Authorization = "Bearer " + token;
            const respuesta = await fetch(ruta, Object.assign({}, opciones || {}, {
              headers,
              body: opciones && opciones.body ? JSON.stringify(opciones.body) : undefined
            }));
            const cuerpo = await respuesta.json().catch(() => ({}));
            if (!respuesta.ok) {
              const e = new Error(cuerpo.error || ("Error " + respuesta.status));
              e.status = respuesta.status;
              e.reinstalar = cuerpo.reinstalar;
              e.renovarPase = respuesta.headers.get("X-Shopify-Retry-Invalid-Session-Request") === "1";
              if (e.reinstalar && !e.renovarPase) {
                e.message = "Volvé a abrir TiendaIQ desde Apps en Shopify Admin para autorizarla.";
              }
              throw e;
            }
            return cuerpo;
          } catch (error) {
            if (reintentosPase === 0 && (esPaseVencido(error) || error.renovarPase)) {
              reintentosPase++;
              await new Promise((resolver) => setTimeout(resolver, 120));
              continue;
            }
            throw error;
          }
        }
      }

      function avisar(texto) {
        estado.hidden = true;
        error.hidden = false;
        error.innerHTML = escapar(texto);
      }

      let temporizador;
      function notificar(texto) {
        notificacion.textContent = texto;
        notificacion.hidden = false;
        clearTimeout(temporizador);
        temporizador = setTimeout(() => { notificacion.hidden = true; }, 4200);
      }

      async function iniciar() {
        if (!id) return avisar("Falta el id de la página. Abrí el editor desde una página existente.");
        try {
          const pagina = await api("/api/paginas/" + encodeURIComponent(id));
          if (!pagina.documento) throw new Error(pagina.documento_error || "La página no pudo convertirse al documento v1.");
          estado.hidden = true;
          TiqEditor.montarEditor(raiz, {
            documento: pagina.documento,
            producto: pagina.producto_preview || null,
            rutaCss: "/dist/render.css",
            titulo: pagina.titulo || pagina.documento.titulo || "Página de producto",
            subtitulo: "Editor de página",
            alGuardar: async (documento) => {
              const guardado = await api("/api/paginas/" + encodeURIComponent(id), { method: "PUT", body: { documento } });
              if (!guardado.documento) throw new Error("El servidor no devolvió el borrador guardado.");
            },
            alPublicar: async () => {
              const publicado = await api("/api/paginas/" + encodeURIComponent(id) + "/publicar-v1", { method: "POST" });
              if (!publicado.url_publica) throw new Error("La tienda no devolvió la URL publicada.");
              notificar("Página publicada en la tienda.");
            },
            alEditarVariantes: () => {
              const shop = new URLSearchParams(location.search).get("shop") || "";
              const productoId = String(pagina.shopify_product_id || "").split("/").pop() || "";
              if (!/^[a-z0-9][a-z0-9.-]*\.myshopify\.com$/i.test(shop) || !/^\d+$/.test(productoId)) {
                return notificar("Abrí el producto en Shopify para editar sus variantes.");
              }
              window.open("https://" + shop + "/admin/products/" + productoId, "_blank", "noopener,noreferrer");
            },
            alSubirImagen: async (archivo) => {
              if (!/^image\/(jpeg|png|webp|gif)$/i.test(archivo.type || "")) throw new Error("Elegí una imagen JPG, PNG, WEBP o GIF.");
              if (archivo.size > 10 * 1024 * 1024) throw new Error("La imagen supera el límite de 10 MB.");
              const base64 = await new Promise((resolver, rechazar) => {
                const lector = new FileReader();
                lector.onerror = () => rechazar(new Error("No se pudo leer la imagen."));
                lector.onload = () => resolver(String(lector.result || "").split(",")[1] || "");
                lector.readAsDataURL(archivo);
              });
              const subida = await api("/api/paginas/" + encodeURIComponent(id) + "/imagenes", {
                method: "POST",
                body: { nombre: archivo.name, mime: archivo.type, base64 }
              });
              return { src: subida.url, alt: archivo.name, id: subida.media_id };
            },
          });
          if (pagina.generacion?.status === "paused" || (Array.isArray(pagina.avisos) && pagina.avisos.length)) {
            notificar("La página ya está creada y lista para editar. La generación asistida por IA queda pendiente; no se inventó contenido.");
          }
          raiz.addEventListener("tiq:ia", () => notificar("La edición con IA por bloque queda preparada en este editor; la conexión al proveedor se habilita en la fase de IA."));
          raiz.addEventListener("tiq:notificar", (evento) => notificar(evento.detail?.mensaje || "Acción completada."));
          raiz.addEventListener("tiq:elegir-producto", () => notificar("El selector de producto se conecta al catálogo Shopify en la fase de producto."));
          raiz.addEventListener("tiq:error", (evento) => notificar(evento.detail?.mensaje || "No se pudo completar la acción."));
        } catch (e) {
          avisar(e.message || "No se pudo abrir la página.");
        }
      }

      iniciar();
      raiz.addEventListener("tiq:volver", function () {
        const destino = new URL("/paginas", location.origin);
        const actual = new URLSearchParams(location.search);
        for (const clave of ["shop", "host", "embedded"]) {
          const valor = actual.get(clave);
          if (valor) destino.searchParams.set(clave, valor);
        }
        location.assign(destino.pathname + destino.search);
      });
    }());
  </script>
</body>
</html>
