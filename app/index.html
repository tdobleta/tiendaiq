<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaIQ — Páginas de producto con IA</title>

  <!-- App Bridge: hace que la app viva adentro del admin de Shopify.
       Va antes que todo lo demás; Shopify lo exige así.
       El api-key lo inyecta el server desde .env. -->
  <meta name="shopify-api-key" content="{{SHOPIFY_CLIENT_ID}}">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>

  <!-- Inter: la tipografía del admin de Shopify (y de PagePilot). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Menú lateral del admin de Shopify (App Bridge lo dibuja bajo el nombre
       de la app). Fuera del admin no se muestra. -->
  <ui-nav-menu style="display:none">
    <a href="/" rel="home">Inicio</a>
    <a href="/paginas">Páginas de producto con IA</a>
    <a href="/cod">Formulario COD</a>
    <a href="/bundles">Bundles y descuentos</a>
  </ui-nav-menu>

  <!-- Adentro del admin, Shopify ya pone su propio header: el nuestro sobra.
       app.js le pone la clase "embebida" al body y este header se oculta. -->
  <header class="barra">
    <div class="barra__marca">
      <span class="barra__logo">T</span> TiendaIQ
    </div>
    <nav class="pasos" id="pasos"></nav>
  </header>

  <main id="vista"></main>

  <!-- El MISMO script/css que se inyecta en la tienda, para que el preview
       del formulario COD sea idéntico a lo que ve el cliente final. -->
  <link rel="stylesheet" href="/cod-form/tiendaiq-cod.css">
  <script src="/cod-form/tiendaiq-cod.js"></script>

  <!-- El MISMO css que se inyecta en la tienda, para que el preview del
       widget de bundles sea idéntico a lo que ve el cliente. -->
  <link rel="stylesheet" href="/bundle-form/tiendaiq-bundle.css">

  <script src="app.js"></script>
</body>
</html>
