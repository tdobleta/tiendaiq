<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaIQ — Landing pages, bundles, COD y secciones</title>
  <link rel="icon" type="image/svg+xml" href="/marca/impulso.svg">

  <!-- App Bridge: hace que la app viva adentro del admin de Shopify.
       Va antes que todo lo demás; Shopify lo exige así.
       El api-key lo inyecta el server desde .env. -->
  <meta name="shopify-api-key" content="{{SHOPIFY_CLIENT_ID}}">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>

  <!-- Tipografía del sistema (sin Google Fonts): render-blocking + host de
       terceros dentro del admin. El admin de Shopify ya usa el stack del
       sistema; la app lo hereda vía app.css. -->
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Menú lateral del admin de Shopify (App Bridge lo dibuja bajo el nombre
       de la app). Fuera del admin no se muestra. -->
  <ui-nav-menu style="display:none">
    <a href="/" rel="home">Inicio</a>
    <a href="/paginas">Páginas de producto con IA</a>
    <a href="/cod">Formulario COD</a>
    <a href="/bundles">Bundles y descuentos</a>
  </ui-nav-menu>

  <!-- Título nativo del header del admin (App Bridge lo dibuja arriba de todo).
       app.js le setea el title por pantalla. Fuera del admin no muestra nada. -->
  <ui-title-bar id="tiq-title-bar"></ui-title-bar>

  <!-- Save Bar contextual de Shopify (App Bridge la dibuja en el chrome del
       admin cuando hay cambios sin guardar). La controla app.js. -->
  <ui-save-bar id="tiq-save-bar">
    <button variant="primary" id="tiq-sb-save">Guardar</button>
    <button id="tiq-sb-discard">Descartar</button>
  </ui-save-bar>

  <!-- Adentro del admin, Shopify ya pone su propio header: el nuestro sobra.
       app.js le pone la clase "embebida" al body y este header se oculta. -->
  <header class="barra">
    <div class="barra__marca">
      <img class="barra__logo" src="/marca/impulso.svg" alt="" width="26" height="26">
      <span class="barra__nombre">TiendaIQ</span>
      <span class="barra__tag">Landing pages, bundles, COD y secciones — todo en 1</span>
    </div>
    <nav class="pasos" id="pasos"></nav>
  </header>

  <main id="vista"></main>

  <!-- Los assets del preview de COD/Bundles (el MISMO css/js que ve el cliente)
       NO se cargan acá: se inyectan diferidos solo al entrar a esas pantallas
       (app.js → cargarWidget), para no bajarlos ni parsearlos en Inicio/Páginas. -->
  <script src="app.js"></script>
</body>
</html>
