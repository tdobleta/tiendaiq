<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantilla de página de producto</title>
  <!-- El render y los estilos viven en el theme app extension (hogar único).
       El server los sirve en /widgets/; data.js queda local (datos de prueba). -->
  <link rel="stylesheet" href="/widgets/tiendaiq.css?v=7">
  <link rel="stylesheet" href="/widgets/piloto-pdp-01.css?v=7">
</head>
<body>
  <div id="app"></div>
  <!-- Piloto 01 usa un renderer propio. El preview del admin debe ofrecer el
       mismo punto de montaje que el app block de Shopify; sin este nodo el
       borrador se genera pero el canvas queda vacío. -->
  <div id="piloto-pdp-01" class="p01__loading" aria-live="polite"></div>
  <script src="data.js?v=7"></script>
  <script src="/widgets/tiendaiq.js?v=7"></script>
  <script src="/widgets/piloto-pdp-01.js?v=7"></script>
</body>
</html>
