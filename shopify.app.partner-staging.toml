# Configuración de la identidad Shopify que pertenece a la organización Partner
# Onepilot. Es distinta del staging legado y de la aplicación pública futura.
# No contiene ningún secreto: el secreto de cliente vive únicamente en Render.
# Identity verified in the current Shopify Dev Dashboard: this existing app
# has zero installs, but it has a legacy version history. It is a Partner
# Staging candidate only after the separate remote-identity audit is reviewed.
# Do not replace it with the installed Staging or public-app identities.
client_id = "91ac2b61f8d21cc0e788a34a81f2ad58"
name = "TiendaIQ Partner Staging"
handle = "tiendaiq-partner-staging"
application_url = "https://tiendaiq-partner-staging-web.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = "tienda-prueba-iq.myshopify.com"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://tiendaiq-partner-staging-web.onrender.com/webhooks"

[access_scopes]
scopes = "read_products,write_products,read_files,write_files,read_content,write_content,read_discounts,write_discounts,write_online_store_navigation"
use_legacy_install_flow = false
optional_scopes = []

[auth]
redirect_urls = [
  "https://tiendaiq-partner-staging-web.onrender.com/auth/callback"
]

[pos]
embedded = false
