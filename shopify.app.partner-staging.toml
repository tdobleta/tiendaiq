# Configuración de la identidad Shopify que pertenece a la organización Partner
# Onepilot. Es distinta del staging legado y de la aplicación pública futura.
# No contiene ningún secreto: el secreto de cliente vive únicamente en Render.
# Identidad verificada directamente en la organización Partner Onepilot. Esta
# aplicación fue creada para Partner Staging y no tiene instalaciones. La
# distribución sigue siendo una decisión explícita y separada: no reutilizar
# ninguna aplicación merchant, staging legado ni identidad pública.
client_id = "84c005c4433b94ed2d8b6b0729e6de54"
name = "TiendaIQ Partner Staging"
handle = "tiendaiq-partner-staging"
application_url = "https://tiendaiq-partner-staging-web.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = false
# La app Partner pertenece a Onepilot. El picker de instalación administrada
# sólo muestra dev stores de esa organización; la tienda histórica
# tienda-prueba-iq pertenece a otra y no es un target instalable aquí.
dev_store_url = "tiendaiq-partner-staging.myshopify.com"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://tiendaiq-partner-staging-web.onrender.com/webhooks"

[access_scopes]
scopes = "read_products,write_products,read_files,write_files,read_content,write_content,read_discounts,write_discounts,write_online_store_navigation"
use_legacy_install_flow = false
optional_scopes = []

[auth]
redirect_urls = [
  "https://tiendaiq-partner-staging-web.onrender.com/auth/callback"
]

[pos]
embedded = false
