# ============================================================
# Configuración de la app para el CLI de Shopify.
#
# Este archivo es la fuente de verdad de lo que se sube al Partner Dashboard:
# `shopify app deploy` sube esta config junto con el extension (Shopify lo
# volvió obligatorio, por eso el CLI sacó include_config_on_deploy).
#
# El orden seguro para tocarlo es: `shopify app config link` primero — trae lo
# que el Dashboard tiene HOY y pisa este archivo — y recién después comparar y
# corregir. Al hacerlo la primera vez apareció que el Dashboard declaraba solo
# 4 alcances mientras auth.js pedía 11 (ver abajo).
# ============================================================

client_id = "59ad704eec8ec59e82d848f09e8d9097"
name = "TiendaIQ: Páginas con IA"

# OJO (2026-07-28): el client_id REAL de la app (la del dev dashboard, con las
# instalaciones) es `59ad704eec8ec59e82d848f09e8d9097` — TERMINA EN ...9097.
# Todo el drama de "firma inválida" / "emitido para otra app" / OAuth
# "application_cannot_be_found" fue un TYPO de un carácter: se venía usando
# `...9897` (un 8 en vez del 0) en Render y acá. El valor `91ac2b61…` que estuvo
# antes era de una app vieja/equivocada. Verificado por diagnóstico: la tienda
# manda aud=...9097 y firmaOk=true (el secreto siempre estuvo bien).
handle = "tiendaiq-app"

# El dominio propio. Ver pruebas/coherencia.js: los dos app embeds tienen que
# apuntar acá, y el chequeo falla si alguno se queda atrás.
application_url = "https://tiendaiq.com"

# La app vive adentro del admin de Shopify (App Bridge + iframe). Ver el
# Content-Security-Policy de servirIndex() en server.js.
embedded = true

[build]
# El servidor es Node puro y se deploya en Render, no con el CLI de Shopify.
# `shopify app deploy` acá sirve para dos cosas: publicar el theme app
# extension de extensions/tiendaiq-widgets, y subir esta config.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  # Obligatorios para el App Store, aunque no guardemos datos de clientes
  # finales (solo tokens de tienda y páginas generadas). El handler responde
  # 200 después de validar la firma; ver el comentario en server.js.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://tiendaiq.com/webhooks"
  customer_deletion_url = "https://tiendaiq.com/webhooks"
  shop_deletion_url = "https://tiendaiq.com/webhooks"

  # app/uninstalled y app_subscriptions/update NO se declaran acá.
  #
  # Shopify rechaza el deploy si hay suscripciones de webhook en este archivo
  # mientras use_legacy_install_flow siga en true: las suscripciones "de app"
  # son parte de la instalación gestionada. Con el flujo legacy, los webhooks
  # se registran por tienda, que es exactamente lo que auth.js ya hace por
  # GraphQL al terminar cada instalación (webhookSubscriptionCreate).
  #
  # O sea: no se pierde nada, solo deja de estar duplicado. Cuando se migre a
  # instalación gestionada, este bloque vuelve y el registro de auth.js sale.

[access_scopes]
# Mismo string que ALCANCES en auth.js — pruebas/coherencia.js falla si se
# separan.
#
# El Dashboard tenía declarados SOLO los primeros cuatro. Funcionaba igual
# porque con use_legacy_install_flow los alcances que valen son los de la URL
# del OAuth (los que arma auth.js), no los declarados acá. Pero el review del
# App Store mira lo declarado, así que se alinean.
#
#   read/write_products   páginas de producto con IA
#   read/write_files      imágenes que sube el merchant (Files API)
#   read/write_content    páginas About/Contact del módulo de contenido
#   write_discounts       descuentos automáticos de los bundles
#   read_orders           métricas agregadas de bundles en los últimos 30 días
#   write_online_store_navigation   menú principal en español
scopes = "read_products,write_products,read_files,write_files,read_content,write_content,write_discounts,read_orders,write_online_store_navigation"

# ⚠ EN true A PROPÓSITO, POR AHORA.
#
# Es como está instalada hoy la app y como funciona el OAuth de auth.js
# (redirect clásico con ?scope=). Pasarlo a false activa la instalación
# gestionada por Shopify, que es el camino moderno y el que conviene para el
# App Store — pero cambia cómo se otorgan los alcances y cómo entra el
# merchant, así que es una migración aparte, con su prueba de instalación
# completa en la dev store. No se mezcla con el deploy del extension.
use_legacy_install_flow = true

optional_scopes = [ ]

[auth]
# Las DOS URLs quedan habilitadas mientras dure la mudanza de dominio. El
# viejo sigue respondiendo (el toggle "Render Subdomain" está encendido), así
# que no hay un instante de corte: si algo del dominio nuevo falla, las
# instalaciones siguen entrando por el viejo.
#
# Sacar el de onrender cuando tiendaiq.com lleve unas semanas estable.
redirect_urls = [
  "https://tiendaiq.com/auth/callback",
  "https://tiendaiq.onrender.com/auth/callback"
]

# Sin [app_proxy] a propósito: el widget del storefront habla con /publico/*
# por CORS, no por proxy de app.

[pos]
embedded = false
