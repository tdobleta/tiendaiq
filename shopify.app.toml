# ============================================================
# Configuración de la app para el CLI de Shopify.
#
# Este archivo es la fuente de verdad de lo que se sube al Partner Dashboard
# con `shopify app deploy`: URLs, alcances y webhooks. Refleja EXACTAMENTE lo
# que la app ya hace hoy en producción:
#
#   - alcances       → los mismos de ALCANCES en auth.js
#   - redirect       → /auth/callback, que es lo que arma iniciarInstalacion
#   - webhooks       → /webhooks, el único handler (server.js), que verifica
#                      el HMAC sobre los bytes crudos antes de mirar el tópico
#
# ⚠ ANTES del primer `shopify app deploy`, correr `shopify app config link` y
#   elegir la app de producción. Ese comando reescribe este archivo con lo que
#   ya está cargado en el Partner Dashboard: si algo de acá no coincide, se ve
#   en el diff y se corrige antes de pisar la config real.
# ============================================================

client_id = "91ac2b61f8d21cc0e788a34a81f2ad58"
name = "TiendaIQ"
handle = "tiendaiq"
application_url = "https://tiendaiq.onrender.com"

# La app vive adentro del admin de Shopify (App Bridge + iframe). Ver el
# Content-Security-Policy de servirIndex() en server.js.
embedded = true

[access_scopes]
# Mismo string que ALCANCES en auth.js. Si cambian ahí, cambian acá: el
# Dashboard y el OAuth tienen que pedir lo mismo o las tiendas quedan a medio
# autorizar.
#
#   read/write_products   páginas de producto con IA
#   read/write_themes     inyección del formulario COD y del widget de bundles
#   write_orders          crea el pedido real contra reembolso
#   read/write_files      imágenes que sube el merchant (Files API)
#   read/write_content    páginas About/Contact del módulo de contenido
#   write_discounts       descuentos automáticos de los bundles
#   write_online_store_navigation   menú principal en español
scopes = "read_products,write_products,read_themes,write_themes,write_orders,read_files,write_files,read_content,write_content,write_discounts,write_online_store_navigation"

# El merchant autoriza durante la instalación, no de a poco. Con esto en
# false, Shopify pide todos los alcances de una en el OAuth.
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://tiendaiq.onrender.com/auth/callback"
]

[webhooks]
api_version = "2026-07"

  # Obligatorios para el App Store, aunque no guardemos datos de clientes
  # finales (solo tokens de tienda y páginas generadas). El handler responde
  # 200 después de validar la firma; ver el comentario en server.js.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://tiendaiq.onrender.com/webhooks"
  customer_deletion_url = "https://tiendaiq.onrender.com/webhooks"
  shop_deletion_url = "https://tiendaiq.onrender.com/webhooks"

  # app/uninstalled          → borra el token al instante
  # app_subscriptions/update → si cancelan o vence el plan, baja a gratis
  #
  # auth.js también los registra por GraphQL al terminar la instalación. No se
  # duplican: Shopify rechaza un segundo registro del mismo tópico y URL, y ese
  # error se loguea y se ignora. Declararlos acá es lo que pide el review.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled", "app_subscriptions/update" ]
  uri = "https://tiendaiq.onrender.com/webhooks"

# Sin [app_proxy] a propósito: el widget del storefront habla con /publico/*
# por CORS, no por proxy de app.

[pos]
embedded = false

[build]
# El servidor es Node puro y se deploya en Render, no con el CLI de Shopify.
# `shopify app deploy` acá sirve para UNA sola cosa: publicar el theme app
# extension de extensions/tiendaiq-widgets.
automatically_update_urls_on_dev = false
include_config_on_deploy = true
