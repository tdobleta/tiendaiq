# ============================================================
# Render - infraestructura de TiendaIQ en un archivo.
#
# Web y worker reciben solo URLs de usuarios separados creados en Database >
# Credentials. La credencial propietaria queda fuera de los procesos runtime y
# vive unicamente en el entorno protegido del workflow de release de staging.
# ============================================================

databases:
  - name: tiendaiq-db
    plan: basic-256mb
    databaseName: tiendaiq
    postgresMajorVersion: "16"

services:
  - type: web
    name: tiendaiq
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /ready
    envVars:
      # URL interna del usuario tiendaiq_web. Nunca usar la credencial duena.
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # 32 bytes en base64. Produccion falla al arrancar si falta.
      - key: TOKEN_ENC_KEY
        sync: false
      # Compatible con Node 20+; usa las CA del sistema para Postgres sin
      # desactivar la verificacion TLS.
      - key: NODE_OPTIONS
        value: "--use-openssl-ca"
      # CA de PostgreSQL para validar TLS. Mantener como secreto multilinea.
      - key: PG_CA_CERT
        sync: false
      - key: PG_POOL_MAX
        value: "10"
      - key: SHOPIFY_OAUTH_TIMEOUT_MS
        value: "15000"
      - key: ANTHROPIC_TIMEOUT_MS
        value: "120000"
      - key: TEXT_EDIT_CONCURRENCY
        value: "4"
      - key: PUBLIC_BUNDLES_CACHE_MS
        value: "60000"
      - key: GENERATION_QUEUE_MAX_PER_TENANT
        value: "2"
      - key: GENERATION_QUEUE_MAX_GLOBAL
        value: "120"
      - key: DEV_MODE
        value: "0"
      - key: PAGINAS_GRATIS
        value: "3"
      # Mantener en 1 hasta terminar el QA de billing en la dev store.
      - key: PLAN_TEST
        value: "1"

  - type: worker
    name: tiendaiq-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      # URL interna del usuario tiendaiq_worker.
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENC_KEY
        sync: false
      - key: NODE_OPTIONS
        value: "--use-openssl-ca"
      - key: PG_CA_CERT
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PG_POOL_MAX
        value: "12"
      - key: ANTHROPIC_TIMEOUT_MS
        value: "120000"
      - key: JOB_GENERATION_CONCURRENCY
        value: "8"
      - key: JOB_PUBLICATION_CONCURRENCY
        value: "4"
      - key: WEBHOOK_CONCURRENCY
        value: "2"
      - key: JOB_POLL_MS
        value: "1000"
      - key: JOB_LEASE_SECONDS
        value: "300"
      - key: DEV_MODE
        value: "0"
