# ============================================================
# Render - infraestructura de TiendaIQ en un archivo.
#
# Web y worker reciben URLs de logins PostgreSQL propios y mínimos, creados por
# el workflow protegido. Las credenciales administradas por Render y la
# credencial propietaria quedan fuera de los procesos runtime.
# ============================================================

databases:
  - name: tiendaiq-db
    plan: basic-256mb
    databaseName: tiendaiq
    postgresMajorVersion: "16"

services:
  - type: web
    name: tiendaiq
    runtime: node
    plan: starter
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /ready
    envVars:
      # URL interna del usuario tiendaiq_web_login. Nunca usar una credencial
      # administrada por Render ni la credencial duena.
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      # Slug público de App Home; no confundir con SHOPIFY_CLIENT_ID.
      - key: SHOPIFY_APP_HANDLE
        value: "tiendaiq-app"
      # Identidad no secreta e inmutable de esta instalación Shopify. Debe
      # coincidir con el singleton de la base antes de aceptar tráfico.
      - key: SHOPIFY_APP_REGISTRATION_ID
        value: "tiendaiq-production-v1"
      # 32 bytes en base64. Produccion falla al arrancar si falta.
      - key: TOKEN_ENC_KEY
        sync: false
      # Debe ser el mismo identificador no secreto que el servicio web y el
      # singleton de esta base. No representa provider ni billing.
      - key: SHOPIFY_APP_REGISTRATION_ID
        value: "tiendaiq-production-v1"
      # DATABASE_URL es interna y viaja solo por la red privada de Render.
      - key: PG_PRIVATE_NETWORK
        value: "1"
      # PostgreSQL switches into this NOINHERIT role before the first query.
      - key: PG_RUNTIME_ROLE
        value: "tiendaiq_web_runtime"
      - key: PG_POOL_MAX
        value: "10"
      - key: SHOPIFY_OAUTH_TIMEOUT_MS
        value: "15000"
      - key: PUBLIC_BUNDLES_CACHE_MS
        value: "60000"
      - key: GENERATION_QUEUE_MAX_PER_TENANT
        value: "2"
      - key: GENERATION_QUEUE_MAX_GLOBAL
        value: "120"
      # Fail-closed: abrir solo despues de confirmar saldo, cuota y capacidad.
      - key: GENERATION_ADMISSION_PAUSED
        value: "1"
      - key: GENERATION_ADMISSION_RETRY_AFTER_SECONDS
        value: "300"
      # Token bearer para /ops/status. Sirve a monitores externos; no contiene
      # datos de tenants y debe rotarse como cualquier secreto operativo.
      - key: OPS_STATUS_TOKEN
        sync: false
      - key: DEV_MODE
        value: "0"
      # Mantener en 1 hasta terminar el QA de billing en la dev store.
      - key: PLAN_TEST
        value: "1"
      - key: EMAIL_SOPORTE
        sync: false
      - key: RAZON_SOCIAL
        sync: false
      - key: DOMICILIO
        sync: false

  - type: worker
    name: tiendaiq-worker
    runtime: node
    plan: starter
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      # URL interna del usuario tiendaiq_worker_login.
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENC_KEY
        sync: false
      - key: PG_PRIVATE_NETWORK
        value: "1"
      - key: PG_RUNTIME_ROLE
        value: "tiendaiq_worker_runtime"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PG_POOL_MAX
        value: "12"
      - key: ANTHROPIC_TIMEOUT_MS
        value: "120000"
      - key: JOB_GENERATION_CONCURRENCY
        value: "8"
      - key: JOB_PUBLICATION_CONCURRENCY
        value: "4"
      - key: WEBHOOK_CONCURRENCY
        value: "2"
      - key: JOB_POLL_MS
        value: "1000"
      - key: JOB_LEASE_SECONDS
        value: "300"
      - key: WORKER_PREFLIGHT_TIMEOUT_MS
        value: "15000"
      - key: WORKER_HEARTBEAT_MS
        value: "15000"
      - key: DEV_MODE
        value: "0"
