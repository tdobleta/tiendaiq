# ============================================================
# Verificación antes de que Render deploye.
#
# Render autodeploya de `main`: sin esto, un error de sintaxis o un server que
# no arranca llega a las tiendas de los merchants y el rollback es a mano.
#
# Ejecuta sintaxis, coherencia, unidad, humo y aislamiento real sobre una base
# PostgreSQL 17 desechable antes de permitir que un cambio llegue a producción.
# ============================================================

name: verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Instala exactamente las dependencias declaradas por el proyecto.
      - run: npm ci --no-audit --no-fund

      - name: Sintaxis de todos los .js
        run: npm run verificar

      - name: Coherencia entre archivos de config
        run: npm run coherencia

      - name: Preparar PostgreSQL con rol sin bypass
        env:
          ALLOW_DB_BOOTSTRAP: "1"
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          TEST_MIGRATION_DATABASE_URL: postgresql://tiendaiq_migrator:migrator_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
          TEST_DATABASE_URL: postgresql://tiendaiq_web:web_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
          TEST_WORKER_DATABASE_URL: postgresql://tiendaiq_worker:worker_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
        run: node scripts/preparar-db-integracion.js

      - name: Migraciones idempotentes y aislamiento RLS real
        env:
          ALLOW_RLS_TEST: "1"
          MIGRATION_DATABASE_URL: postgresql://tiendaiq_migrator:migrator_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
          DATABASE_URL: postgresql://tiendaiq_web:web_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
          TEST_DATABASE_URL: postgresql://tiendaiq_web:web_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
          TEST_WORKER_DATABASE_URL: postgresql://tiendaiq_worker:worker_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
        run: npm run db:test:integration

      - name: Cola durable y limpieza sobre PostgreSQL real
        env:
          ALLOW_QUEUE_LOAD_TEST: "1"
          TEST_DATABASE_URL: postgresql://tiendaiq_web:web_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
          TEST_WORKER_DATABASE_URL: postgresql://tiendaiq_worker:worker_test@127.0.0.1:5432/tiendaiq_staging?sslmode=disable
          LOAD_TENANTS: "100"
          LOAD_JOBS: "100"
          LOAD_SETUP_CONCURRENCY: "20"
          LOAD_WORKER_LANES: "8"
          LOAD_FAKE_WORK_MS: "1"
          LOAD_MAX_DRAIN_SECONDS: "60"
          PG_POOL_MAX: "10"
        run: npm run carga:cola

      - name: Pruebas de unidad y dominio
        run: npm run unidad

      - name: Prueba de humo
        run: npm run humo
