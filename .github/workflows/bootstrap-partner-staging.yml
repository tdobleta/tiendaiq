name: Bootstrap Partner Staging database

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completo revisado y presente en main
        required: true
        type: string
      confirmation:
        description: Escribir BOOTSTRAP_PARTNER_STAGING_DATABASE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiendaiq-partner-staging-database-maintenance
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: partner-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate immutable bootstrap request
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "release_sha debe ser un SHA completo" >&2; exit 1; }
          [[ "$CONFIRMATION" == "BOOTSTRAP_PARTNER_STAGING_DATABASE" ]] || { echo "confirmacion invalida" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]] || { echo "checkout distinto al SHA solicitado" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$REQUESTED_SHA" ]] || { echo "el SHA debe ser HEAD de main" >&2; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      - name: Create isolated runtime roles
        env:
          ALLOW_ROLE_BOOTSTRAP: "1"
          BOOTSTRAP_LEGACY_COMPATIBILITY_ROLES: "1"
          MIGRATION_DATABASE_URL: ${{ secrets.PARTNER_STAGING_MIGRATION_DATABASE_URL }}
          WEB_RUNTIME_LOGIN_PASSWORD: ${{ secrets.PARTNER_STAGING_WEB_RUNTIME_LOGIN_PASSWORD_V2 }}
          WORKER_RUNTIME_LOGIN_PASSWORD: ${{ secrets.PARTNER_STAGING_WORKER_RUNTIME_LOGIN_PASSWORD_V2 }}
        run: node scripts/preparar-roles-runtime.js

      - name: Migrate the isolated Partner Staging database
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PARTNER_STAGING_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate

      - name: Bind this database to Partner Staging only
        env:
          APP_REGISTRATION_BIND_CONFIRMATION: BIND_ONE_SHOPIFY_APP_REGISTRATION
          SHOPIFY_APP_REGISTRATION_ID: tiendaiq-partner-staging-v1
          MIGRATION_DATABASE_URL: ${{ secrets.PARTNER_STAGING_MIGRATION_DATABASE_URL }}
        run: node scripts/vincular-registro-shopify.js
