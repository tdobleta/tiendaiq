name: Requeue one staging compensation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completo revisado y presente en main
        required: true
        type: string
      job_id:
        description: UUID exacto del job cuya compensacion esta en dead_letter
        required: true
        type: string
      reason:
        description: Motivo operativo (20 a 500 caracteres)
        required: true
        type: string
      confirmation:
        description: Escribir REQUEUE_ONE_COMPENSATION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiendaiq-staging-compensation-recovery
  cancel-in-progress: false

jobs:
  recover-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate reviewed code and deliberate authorization
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          JOB_ID: ${{ inputs.job_id }}
          REASON: ${{ inputs.reason }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "release_sha debe ser un SHA completo" >&2; exit 1; }
          [[ "$JOB_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "job_id debe ser un UUID" >&2; exit 1; }
          [[ ${#REASON} -ge 20 && ${#REASON} -le 500 ]] || { echo "reason debe tener entre 20 y 500 caracteres" >&2; exit 1; }
          [[ "$CONFIRMATION" == "REQUEUE_ONE_COMPENSATION" ]] || { echo "confirmacion invalida" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "checkout distinto al SHA solicitado" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]] || { echo "el codigo operativo debe ser HEAD de main" >&2; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - run: npm ci --no-audit --no-fund

      - name: Requeue exactly one audited compensation
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          PG_CA_CERT: ${{ secrets.STAGING_PG_CA_CERT }}
          COMPENSATION_JOB_ID: ${{ inputs.job_id }}
          COMPENSATION_RECOVERY_REASON: ${{ inputs.reason }}
          COMPENSATION_RECOVERY_ACTOR: ${{ github.actor }}
          COMPENSATION_RECOVERY_SOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run ops:requeue-compensation
