name: Inventory legacy review avatars Partner Staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completo actual de main que contiene el inventario revisado
        required: true
        type: string
      confirmation:
        description: Escribir INVENTORY_LEGACY_REVIEW_AVATARS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiendaiq-partner-staging-legacy-avatar-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: partner-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate deliberate read-only inventory
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "release_sha debe ser un SHA completo" >&2; exit 1; }
          [[ "$CONFIRMATION" == "INVENTORY_LEGACY_REVIEW_AVATARS" ]] || { echo "confirmacion invalida" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "checkout distinto al SHA solicitado" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]] || { echo "el SHA debe ser HEAD actual de main" >&2; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      - name: Count historical avatar references without exposing URLs
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PARTNER_STAGING_MIGRATION_DATABASE_URL }}
        run: npm run audit:legacy-review-avatars -- --summary
