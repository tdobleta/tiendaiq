name: Bootstrap and bind production database

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completo revisado y presente en main
        required: true
        type: string
      confirmation:
        description: Escribir BOOTSTRAP_RUNTIME_LOGINS_PRODUCTION
        required: true
        type: string
      cutover_acknowledgement:
        description: Escribir ACKNOWLEDGE_PRELAUNCH_DATABASE_CUTOVER
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiendaiq-production-database-maintenance
  queue: max
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate the immutable reviewed prelaunch cutover commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CUTOVER_ACKNOWLEDGEMENT: ${{ inputs.cutover_acknowledgement }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "release_sha debe ser un SHA completo" >&2; exit 1; }
          [[ "$CONFIRMATION" == "BOOTSTRAP_RUNTIME_LOGINS_PRODUCTION" ]] || { echo "Confirmacion invalida" >&2; exit 1; }
          [[ "$CUTOVER_ACKNOWLEDGEMENT" == "ACKNOWLEDGE_PRELAUNCH_DATABASE_CUTOVER" ]] || { echo "Cutover no reconocido" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]] || { echo "El checkout no coincide con el SHA solicitado" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$REQUESTED_SHA" ]] || { echo "El SHA debe ser el HEAD actual de main" >&2; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      - name: Create isolated PostgreSQL runtime logins for the prelaunch cutover
        env:
          ALLOW_ROLE_BOOTSTRAP: "1"
          # Las migraciones históricas nombran estos roles NOLOGIN. Crearlos
          # durante el bootstrap permite migrar una base realmente nueva sin
          # convertirlos en credenciales de servicio.
          BOOTSTRAP_LEGACY_COMPATIBILITY_ROLES: "1"
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          WEB_RUNTIME_LOGIN_PASSWORD: ${{ secrets.PRODUCTION_WEB_RUNTIME_LOGIN_PASSWORD }}
          WORKER_RUNTIME_LOGIN_PASSWORD: ${{ secrets.PRODUCTION_WORKER_RUNTIME_LOGIN_PASSWORD }}
        run: node scripts/preparar-roles-runtime.js

      - name: Migrate the prelaunch production database after runtime roles exist
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate

      - name: Bind the database to the reviewed production Shopify registration
        env:
          APP_REGISTRATION_BIND_CONFIRMATION: BIND_ONE_SHOPIFY_APP_REGISTRATION
          # This is deliberately source-controlled rather than user input: a
          # protected run cannot bind a reviewed production database to an
          # arbitrary registration supplied at dispatch time.
          SHOPIFY_APP_REGISTRATION_ID: tiendaiq-production-v1
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: node scripts/vincular-registro-shopify.js
