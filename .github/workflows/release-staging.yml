name: Release staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiendaiq-staging-release
  cancel-in-progress: false

env:
  # Candidate reviewed in the isolated staging branch. Update through a reviewed commit.
  STAGING_RELEASE_REF: 0d31c7bca86358768cb9d6bb17697c7ce564fb7e

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_RELEASE_REF }}

      - id: release
        name: Resolve the reviewed release commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-audit --no-fund

      - name: Prepare isolated runtime roles
        env:
          ALLOW_ROLE_BOOTSTRAP: "1"
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: node scripts/preparar-roles-runtime.js

      - name: Migrate staging with the owner credential
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy web after a successful migration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_WEB_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST --get --data-urlencode "ref=${{ steps.release.outputs.sha }}" "$RENDER_DEPLOY_HOOK"

      - name: Deploy worker after a successful migration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_WORKER_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST --get --data-urlencode "ref=${{ steps.release.outputs.sha }}" "$RENDER_DEPLOY_HOOK"
