name: Release staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completo (40 caracteres) revisado y presente en main
        required: true
        type: string
      confirmation:
        description: Escribir DEPLOY_REVIEWED_STAGING
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiendaiq-staging-release
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - id: release
        name: Validate the immutable reviewed release commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "release_sha debe ser un SHA completo" >&2; exit 1; }
          [[ "$CONFIRMATION" == "DEPLOY_REVIEWED_STAGING" ]] || { echo "Confirmacion invalida" >&2; exit 1; }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$REQUESTED_SHA" ]] || { echo "El checkout no coincide con el SHA solicitado" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$ACTUAL_SHA" ]] || { echo "El SHA revisado debe ser el HEAD actual de main" >&2; exit 1; }
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # @shopify/cli@4.1.0 imports node:module.enableCompileCache, which
          # is available in Node 22 but not in the Node 20 runner image.
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      # Shopify versiona la configuracion y los theme app extensions fuera de
      # Render. Pinneamos la CLI para que el release de storefront sea
      # reproducible y no cambie por una actualizacion transitoria del runner.
      - name: Install pinned Shopify CLI for app deployment
        run: npm install --global @shopify/cli@4.1.0

      - name: Prepare isolated runtime roles
        env:
          ALLOW_ROLE_BOOTSTRAP: "1"
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          WEB_RUNTIME_LOGIN_PASSWORD: ${{ secrets.STAGING_WEB_RUNTIME_LOGIN_PASSWORD }}
          WORKER_RUNTIME_LOGIN_PASSWORD: ${{ secrets.STAGING_WORKER_RUNTIME_LOGIN_PASSWORD }}
        run: node scripts/preparar-roles-runtime.js

      - name: Migrate staging with the owner credential
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy web after a successful migration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_WEB_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST --get --data-urlencode "ref=${{ steps.release.outputs.sha }}" "$RENDER_DEPLOY_HOOK"

      - name: Deploy worker after a successful migration
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_WORKER_DEPLOY_HOOK }}
        run: curl --fail-with-body --request POST --get --data-urlencode "ref=${{ steps.release.outputs.sha }}" "$RENDER_DEPLOY_HOOK"

      - name: Wait for the deployed web readiness gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 https://tiendaiq-staging-web.onrender.com/ready \
              | node -e 'let body="";process.stdin.on("data",c=>body+=c).on("end",()=>{const ready=JSON.parse(body);process.exit(ready.ok===true&&ready.release===process.env.EXPECTED_SHA?0:1)})'; then
              echo "Staging web aprobo /ready con el SHA esperado"
              exit 0
            fi
            echo "Esperando readiness de staging ($attempt/60)"
            sleep 10
          done
          echo "Staging no aprobo /ready dentro de 10 minutos" >&2
          exit 1

      # El mismo SHA que corre en Render debe ser la version activa de la app
      # Shopify. Sin este paso, el storefront puede seguir sirviendo una
      # extension anterior aunque /ready y el worker sean verdes.
      - name: Deploy Shopify staging app components for the reviewed SHA
        shell: bash
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.STAGING_SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_CLI_NO_ANALYTICS: "1"
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$SHOPIFY_APP_AUTOMATION_TOKEN" ]] || { echo "Falta STAGING_SHOPIFY_APP_AUTOMATION_TOKEN" >&2; exit 1; }
          shopify app deploy --config staging --allow-updates --source-control-url "$COMMIT_URL"

      - name: Wait for the complete operational release gate
        shell: bash
        env:
          CONFIRMATION: CHECK_STAGING_OPS_READINESS
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          STAGING_APP_URL: https://tiendaiq-staging-web.onrender.com
          OPS_STATUS_TOKEN: ${{ secrets.STAGING_OPS_STATUS_TOKEN }}
          OPS_MAX_QUEUED_JOBS: "20"
          OPS_MAX_OLDEST_JOB_SECONDS: "300"
          OPS_MAX_RUNNING_JOBS: "16"
          OPS_MAX_FAILED_RECENT_JOBS: "0"
          OPS_MAX_STALE_RUNNING_JOBS: "0"
          OPS_MAX_COMPENSATION_PENDING: "0"
          OPS_MAX_COMPENSATION_DEAD_LETTER: "0"
          OPS_MAX_STALE_COMPENSATION: "0"
          OPS_MAX_OLDEST_COMPENSATION_SECONDS: "300"
          OPS_MAX_INBOX_RECEIVED: "20"
          OPS_MAX_INBOX_PROCESSING: "8"
          OPS_MAX_INBOX_FAILED: "0"
          OPS_MAX_INBOX_FAILED_RECENT: "0"
          OPS_MAX_INBOX_STALE_PROCESSING: "0"
          OPS_MAX_OLDEST_INBOX_SECONDS: "300"
          OPS_MAX_WORKER_AGE_SECONDS: "60"
          OPS_MIN_WORKER_UPTIME_SECONDS: "30"
          OPS_MIN_GENERATION_CONCURRENCY: "8"
          OPS_MIN_PUBLICATION_CONCURRENCY: "4"
          OPS_MIN_WEBHOOK_CONCURRENCY: "2"
          OPS_READINESS_PROFILE: technical_preflight
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if npm run ops:readiness; then
              echo "Staging aprobo el gate operativo completo con el SHA esperado"
              exit 0
            fi
            echo "Esperando convergencia operativa de staging ($attempt/60)"
            sleep 10
          done
          echo "Staging no aprobo el gate operativo completo dentro de 10 minutos" >&2
          exit 1
