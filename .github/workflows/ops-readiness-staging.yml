name: Ops readiness staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completo que debe responder /ready
        required: true
        type: string
      confirmation:
        description: CHECK_STAGING_OPS_READINESS
        required: true
        type: string
      certification_mode:
        description: technical_preflight valida infraestructura; go exige condiciones comerciales completas
        required: true
        default: technical_preflight
        type: choice
        options: [technical_preflight, go]

permissions:
  contents: read

concurrency:
  group: tiendaiq-staging-ops-readiness
  cancel-in-progress: false

jobs:
  ops-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate deliberate authorization
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CERTIFICATION_MODE: ${{ inputs.certification_mode }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "release_sha debe ser un SHA completo de 40 caracteres" >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != "CHECK_STAGING_OPS_READINESS" ]]; then
            echo "confirmacion invalida" >&2
            exit 1
          fi
          if [[ "$CERTIFICATION_MODE" != "technical_preflight" && "$CERTIFICATION_MODE" != "go" ]]; then
            echo "certification_mode invalido" >&2
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "checkout distinto al SHA solicitado" >&2; exit 1; }
          git fetch origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]] || { echo "el SHA debe ser HEAD de main" >&2; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - run: npm ci --no-audit --no-fund

      - name: Check staging readiness and durable queue state
        env:
          CONFIRMATION: CHECK_STAGING_OPS_READINESS
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_APP_URL: https://tiendaiq-staging-web.onrender.com
          OPS_STATUS_TOKEN: ${{ secrets.STAGING_OPS_STATUS_TOKEN }}
          OPS_MAX_QUEUED_JOBS: "20"
          OPS_MAX_OLDEST_JOB_SECONDS: "300"
          OPS_MAX_RUNNING_JOBS: "16"
          OPS_MAX_FAILED_RECENT_JOBS: "0"
          OPS_MAX_STALE_RUNNING_JOBS: "0"
          OPS_MAX_COMPENSATION_PENDING: "0"
          OPS_MAX_COMPENSATION_DEAD_LETTER: "0"
          OPS_MAX_STALE_COMPENSATION: "0"
          OPS_MAX_OLDEST_COMPENSATION_SECONDS: "300"
          OPS_MAX_INBOX_RECEIVED: "20"
          OPS_MAX_INBOX_PROCESSING: "8"
          OPS_MAX_INBOX_FAILED: "0"
          OPS_MAX_INBOX_FAILED_RECENT: "0"
          OPS_MAX_INBOX_STALE_PROCESSING: "0"
          OPS_MAX_OLDEST_INBOX_SECONDS: "300"
          OPS_MAX_WORKER_AGE_SECONDS: "60"
          OPS_MIN_WORKER_UPTIME_SECONDS: "30"
          OPS_MIN_GENERATION_CONCURRENCY: "8"
          OPS_MIN_PUBLICATION_CONCURRENCY: "4"
          OPS_MIN_WEBHOOK_CONCURRENCY: "2"
          OPS_READINESS_PROFILE: ${{ inputs.certification_mode }}
        run: npm run ops:readiness
