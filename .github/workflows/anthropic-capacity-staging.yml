name: Anthropic capacity staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completo revisado, presente en main y desplegado en staging
        required: true
        type: string
      profile:
        description: Cantidad de generaciones reales pagas
        required: true
        default: "8"
        type: choice
        options:
          - "8"
          - "50"
          - "500"
      confirmation:
        description: Escribir AUTHORIZE_PAID_ANTHROPIC_STAGING_<perfil>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiendaiq-staging-anthropic-capacity
  cancel-in-progress: false

jobs:
  provider-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate deliberate paid authorization
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git fetch origin main --depth=1
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]]
          [[ "$CONFIRMATION" == "AUTHORIZE_PAID_ANTHROPIC_STAGING_${PROFILE}" ]]

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - run: npm ci --no-audit --no-fund

      - name: Verify staging web runs the reviewed SHA
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 https://tiendaiq-staging-web.onrender.com/ready \
              | node -e 'let body="";process.stdin.on("data",(chunk)=>body+=chunk).on("end",()=>{const ready=JSON.parse(body);process.exit(ready.ok===true&&ready.release===process.env.EXPECTED_RELEASE_SHA?0:1)})'; then
              exit 0
            fi
            sleep 10
          done
          echo "Staging web no confirma el SHA revisado" >&2
          exit 1

      - name: Exercise the real page-generation contract
        env:
          AI_CAPACITY_ENVIRONMENT: staging
          ALLOW_PAID_ANTHROPIC_CAPACITY: I_AUTHORIZE_PAID_ANTHROPIC_STAGING_CAPACITY
          AI_CAPACITY_CALLS: ${{ inputs.profile }}
          AI_CAPACITY_CONCURRENCY: "8"
          AI_CAPACITY_MAX_P95_MS: "120000"
          AI_CAPACITY_MAX_ERROR_RATE: "0.01"
          AI_INPUT_PRICE_USD_PER_MTOK: "5"
          AI_OUTPUT_PRICE_USD_PER_MTOK: "25"
          # Hard ceilings; the pilot request projects cost before the remainder.
          AI_CAPACITY_MAX_BUDGET_USD: ${{ inputs.profile == '500' && '250' || inputs.profile == '50' && '25' || '5' }}
          ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          MODELO_IA: claude-sonnet-5
          ESFUERZO_IA: medium
          ANTHROPIC_TIMEOUT_MS: "120000"
        run: node scripts/probar-capacidad-anthropic.js
